<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advent · the house</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Lora:ital,wght@0,400;0,500;1,400&family=Sacramento&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}

:root{
  --paper:#FCE8C2;
  --paper-2:#F8DFB4;
  --red:#8f0500;
  --red-soft:rgba(143,5,0,.12);
  --green:#044529;
  --green-soft:rgba(4,69,41,.08);
  --gold:#562400;
  --cream:#ffecc5;
  --ink:#562400;
  --ink-soft:rgba(86,36,0,.55);
  --white:#fffbe9;
  --mono:'Cutive Mono','Courier New',monospace;
  --serif:'Lora',Georgia,serif;
  --heading:'Sacramento','Snell Roundhand','Segoe Script',cursive;
}

html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--mono)}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.045;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
}

/* ---------- COUNTDOWN BAR ---------- */
.countdown{
  position:fixed;left:0;right:0;top:0;height:56px;z-index:25;
  display:flex;align-items:center;justify-content:center;gap:16px;
  padding:0 20px;font-family:var(--mono);font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink);
  background:linear-gradient(var(--paper) 70%, rgba(252,232,194,0));
  border-bottom:2px dotted rgba(143,5,0,.22);
}
.countdown .label{color:var(--green);font-weight:400;font-size:12px}
.countdown .num{font-size:28px;font-weight:400;color:var(--red);letter-spacing:.06em;font-variant-numeric:tabular-nums;text-shadow:0 1px 0 rgba(252,232,194,.8)}

/* ---------- STAGE ---------- */
.stage{position:fixed;inset:56px 0 44px;z-index:1;overflow:hidden;display:grid;place-items:center}

/* ---------- HOUSE ---------- */
.house-wrapper{
  position:relative;
  width:min(calc(100vw - 16px), calc((100vh - 100px) * 1122 / 1402), 1122px);
  width:min(calc(100vw - 16px), calc((100dvh - 100px) * 1122 / 1402), 1122px);
  aspect-ratio:1122 / 1402;
}
.house{position:relative;width:100%;height:100%}
.house > svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.house img{display:block;width:100%;height:100%;border-radius:6px;box-shadow:0 30px 60px -30px rgba(86,36,0,.45)}
.house canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* ---------- SNOW & DRIFTS ---------- */
#snow{position:fixed;inset:0;z-index:40;pointer-events:none}
.bank{position:fixed;left:0;right:0;bottom:0;height:44px;z-index:12;cursor:crosshair}
.bank svg{width:100%;height:100%;display:block}
.snowball{
  position:fixed;z-index:41;width:28px;height:28px;border-radius:50%;background:#fff;
  border:1px solid rgba(86,36,0,.22);pointer-events:none;opacity:0;
  box-shadow:0 2px 6px rgba(86,36,0,.18);
  transition:transform .12s, opacity .12s;
}
.snowball.active{opacity:1}
.snowball.thrown{transition:transform .45s cubic-bezier(.2,.7,.3,1), opacity .3s}

/* ---------- CHIP PROGRESS ---------- */
.chip{position:fixed;left:12px;bottom:12px;z-index:22;
  display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);background:rgba(252,232,194,.88);
  border:1px dotted rgba(143,5,0,.3);border-radius:999px;padding:6px 12px;
  backdrop-filter:blur(3px)}
.chip b{color:var(--red);font-weight:400}
.chip .rst{margin-left:6px;color:rgba(86,36,0,.4);cursor:pointer;border:0;background:none;font:inherit;letter-spacing:.14em}
.chip .rst:hover{color:var(--red)}

/* ---------- GARLAND ---------- */
.bulb{animation:blink 3s infinite}
.bulb:nth-child(2n){animation-delay:.6s}
.bulb:nth-child(3n){animation-delay:1.2s}
@keyframes blink{0%,68%,100%{opacity:1}76%,84%{opacity:.18}}
@media(prefers-reduced-motion:reduce){.bulb{animation:none}}

/* ---------- TASK PAGE ---------- */
.task-page{
  position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto;
  animation:pageIn .3s cubic-bezier(.2,.7,.3,1);
}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.task-page .garland{position:absolute;inset:0 0 auto;width:100%;height:52px;display:block;pointer-events:none;opacity:.95}
.tp-inner{position:relative;max-width:840px;margin:0 auto;padding:112px 24px 120px}
.back{position:fixed;left:14px;top:52px;z-index:32}
.task-page :is(.back,.tp-links a,.tp-done){
  appearance:none;
  display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;max-width:100%;padding:9px 16px;
  font-family:var(--serif);font-size:clamp(15px,1.6vw,18px);line-height:1.3;
  color:#70251f;background:var(--paper);border:0;border-radius:0;
  text-decoration:none;cursor:pointer;
  position:relative;isolation:isolate;
}
.task-page .back{position:fixed}
.task-page :is(.back,.tp-links a,.tp-done)::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  border:2px solid var(--green);
  border-radius:2% 1% 2% 1% / 6% 4% 6% 4%;
  transform:rotate(-.55deg);
}
.task-page :is(.back,.tp-links a,.tp-done)::after{
  content:"";position:absolute;inset:1px -1px -1px 1px;pointer-events:none;
  border:1px solid var(--green);opacity:.5;transform:rotate(.65deg);
}
.task-page :is(.back,.tp-links a,.tp-done):hover,
.task-page .tp-done.on{background:#f0dfb6}
.task-page :is(.back,.tp-links a,.tp-done):focus-visible{outline:2px dotted #70251f;outline-offset:4px}

.tp-title-badge{
  font:400 clamp(28px,4vw,42px)/1.2 var(--heading);
  color:#70251f;margin:12px 0 0;
}
.tp-num{font-family:var(--mono);font-size:clamp(52px,8vw,96px);line-height:.9;color:var(--red);letter-spacing:.02em}
.tp-title{
  font:400 clamp(43px,7vw,82px)/1.12 var(--heading);
  color:#70251f;margin:5px 0 24px;overflow-wrap:break-word;
}
.tp-text{font-family:var(--serif);font-size:clamp(22px,2.7vw,30px);line-height:1.6;margin:0 0 28px;max-width:780px}
.tp-text b{color:var(--red);font-weight:400}

.tp-list{margin:0 0 28px;padding:0;list-style:none;max-width:780px}
.tp-list li{font-family:var(--serif);font-size:clamp(19px,2.2vw,24px);line-height:1.7;color:var(--ink);
  padding-left:22px;position:relative}
.tp-list li::before{content:"—";position:absolute;left:0;color:var(--green)}

.tp-shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 26px;max-width:780px}
.tp-shots a{display:block;aspect-ratio:4/3;overflow:hidden;border:1px solid rgba(143,5,0,.3);border-radius:4px}
.tp-shots img{width:100%;height:100%;object-fit:cover;display:block}

.tp-links{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}

.tp-level{font-family:var(--serif);font-size:clamp(19px,2.2vw,24px);line-height:1.6;color:var(--ink);
  border-left:2px solid var(--green);padding-left:18px;margin:0 0 38px;max-width:780px}

.tp-answer{max-width:780px}
.tp-answer textarea{
  width:100%;min-height:150px;resize:vertical;font-family:var(--serif);font-size:clamp(18px,2vw,23px);
  line-height:1.6;color:var(--ink);background:#FDFAF2;border:1.5px dotted rgba(143,5,0,.4);border-radius:4px;padding:16px 18px;outline:none
}
.tp-answer textarea:focus{border-style:solid;border-color:var(--red)}
.tp-actions{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.tp-hint{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}

@media(max-width:700px){
  .tp-inner{padding:110px 18px 110px}
  .tp-shots{grid-template-columns:1fr 1fr}
  .bank{height:32px}
}

/* ---------- CHIP PROGRESS ---------- */
.chip{position:fixed;left:12px;bottom:12px;z-index:22;

}
.snowball.active{opacity:1}
.snowball.thrown{transition:transform .45s cubic-bezier(.2,.7,.3,1), opacity .3s}

/* ---------- WINDOWS ---------- */
.win{
  position:absolute;padding:0;border:0;background:transparent;cursor:pointer;
  perspective:480px;perspective-origin:left center;-webkit-tap-highlight-color:transparent;
}
.win:focus-visible{outline:2px dotted var(--red);outline-offset:3px}

/* FLAP — opens LEFT, digit visible on back of flap */
.flap{
  position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
  background:transparent;
  box-shadow:none;
  display:flex;align-items:center;justify-content:center;
  transition:transform .65s cubic-bezier(.32,.88,.24,1), box-shadow .35s;
  backface-visibility:visible;
}
.flap::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  border:1.4px dotted rgba(143,5,0,.35);border-radius:1px;
  transition:opacity .18s, border-color .18s;
}
.win:hover .flap::after{border-color:rgba(143,5,0,.7);box-shadow:0 0 0 2px rgba(252,232,194,.5)}
.win.open .flap{
  transform:rotateY(118deg);
  box-shadow:-3px 1px 12px -4px rgba(86,36,0,.45), inset 0 0 0 1px rgba(255,255,255,.35);
}
.win.open .flap::after{opacity:.45;transform:rotateY(0deg)}
.win.done .flap::after{border-color:rgba(4,69,41,.45)}

.flap .num{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:var(--mono);font-size:22px;line-height:1;color:var(--red);
  letter-spacing:.02em;text-shadow:0 1px 0 rgba(252,232,194,.95), 0 0 7px rgba(252,232,194,.95);
}
.win.open .flap .num{opacity:0;transition:opacity .15s}

.win .glow{
  position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:1px;
  background:radial-gradient(circle at 50% 58%, rgba(255,236,197,.45), rgba(255,236,197,0) 72%);
  transition:opacity .6s ease;
}
.win.open .glow{opacity:1}

.win .mark{
  position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;border-radius:50%;
  background:var(--green);opacity:0;transition:opacity .3s .2s;pointer-events:none;
  box-shadow:0 0 0 2px var(--paper);
}
.win.done .mark{opacity:1}

    17: "What Would You Say?",
    18: "Translate the Meme",
    19: "The Lost Tradition",
    20: "2026 in Five Words",
    21: "Song of My Year",
    22: "In & Out for 2027",
    23: "Word Chain",
    24: "No Words Needed",
    25: "Alphabet of Christmas",
    26: "Explain It to a 12-Year-Old",
    27: "New Year Then & Now",
    28: "Pitch the Perfect Song",
    29: "Mini Survey",
    30: "3-2-1 Reflection",
    31: "Snow Globe Story"
  };

  const KD = "adv26.house.done", KA = "adv26.house.ans";
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e){ return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
  let done = load(KD, {}), ans = load(KA, {}), current = null;

  /* ---------- SOUND ---------- */
  let ac = null;
  const paperSound = new Audio("assets/window-tear.mp3");
  paperSound.preload = "auto";
  function audio(){
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return null;
    if (!ac) ac = new AudioContext();
    if (ac.state !== "running") ac.resume().catch(() => {});
    return ac;
  }
  function tear(){
    paperSound.currentTime = 0;
    paperSound.play().catch(() => {});
  }
  function pop(){
    const a = audio();
    if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(720, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(430, a.currentTime + .12);
    g.gain.setValueAtTime(.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.11, a.currentTime + .01);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .14);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .16);
  }

  /* ---------- COUNTDOWN TO NEW YEAR ---------- */
  function updateCountdown(){
    const now = new Date();
    const ny = new Date(now.getFullYear(), 11, 31, 23, 59, 59);
    if (now > ny) { el("#countdown").textContent = "0"; return; }
    const diff = Math.ceil((ny - now) / 86400000);
    el("#countdown").textContent = diff;
  }

  /* ---------- GARLAND (realistic) ---------- */
  function drawLights(){
    const colors = ["#942b27", "#ae772c", "#3d5946", "#ad635d"];
    const bulbs = [
      "M-1.7 0 Q-4 4 -3.4 7 Q-2.7 10 .1 9.5 Q3.8 8.6 3.3 5 Q2.5 2 1.5 0Z",
      "M-1.4 0 Q-4.8 3.6 -3.1 7.8 Q-1.4 10.8 1.7 8.7 Q4.4 6.8 2.7 3.2 L1.1 0Z",
      "M-1.4 0 Q-3.5 2.2 -3.7 5.4 Q-4 8.3 -.7 9.7 Q2.9 9.6 3.1 6 Q3 2.6 1.2 0Z"
    ];

    function strand(svg, points, count, seed, scale, height) {
      const random = () => {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
      };
      let wire = "M" + points[0].join(" ");
      for (let i = 1; i < points.length; i++) {
        const [x, y] = points[i];
        const [previousX, previousY] = points[i - 1];
        const span = x - previousX;
        wire += " C" + [previousX + span * .27, previousY + 7 * scale,
          x - span * .28, y + 5 * scale, x, y].join(" ");
      }
      svg.innerHTML = '<path d="' + wire + '" fill="none" stroke="#4a4738" stroke-width="' +
        (.85 * scale) + '" stroke-linecap="round" opacity=".78"/>';
      const ns = "http://www.w3.org/2000/svg";
      const path = svg.firstElementChild;
      const length = path.getTotalLength();
      for (let i = 0; i < count; i++) {
        const pos = path.getPointAtLength(length * (i + .18 + random() * .67) / count);
        const angle = Math.round((random() - .5) * 72);
        const size = scale * (.74 + .44 * random());
        const group = document.createElementNS(ns, "g");
        group.setAttribute("transform", "translate(" + pos.x + " " + pos.y + ") rotate(" +
          angle + ") scale(" + size + ")");
        const color = colors[Math.floor(random() * colors.length)];
        group.innerHTML = '<path d="M0 0 q-.7 2 .2 4 m-1.6 .3 3-.4" fill="none" stroke="#484336" stroke-width="1.1" stroke-linecap="round"/>' +
          '<g transform="translate(0 4) scale(1 ' + height + ')"><path d="' + bulbs[i % bulbs.length] +
          '" fill="' + color + '" stroke="#4e3529" stroke-opacity=".46" stroke-width=".55"/>' +
          '<path d="M-1.5 3.2 q-.8 1.2 -.45 2.45" fill="none" stroke="#fff4cf" stroke-opacity=".57" stroke-width=".65" stroke-linecap="round"/></g>';
        svg.append(group);
      }
    }

    strand(el("#homeGarland"), [[0,8],[109,16],[246,7],[378,22],[546,11],[691,18],[857,9],[1000,15]], 31, 72, 1.15, 1);
    strand(el("#garland"), [[0,9],[157,19],[307,8],[425,15],[591,9],[718,21],[884,10],[1000,15]], 28, 93, 1.10, 1);
  }

  /* ---------- SNOWBALL DRAG ---------- */
  let held = null;
  const bankEl = el("#bank");
  const snowman = el("#snowman");
  const balls = [];

  function place(ball, x, y) {
    const radius = ball.size / 2;
    ball.x = Math.max(radius, Math.min(innerWidth - radius, x));
    ball.y = Math.max(radius, Math.min(innerHeight - radius, y));
    ball.element.style.left = ball.x + "px";
    ball.element.style.top = ball.y + "px";
    ball.element.style.setProperty("--ball-size", ball.size + "px");
  }

  function decorate() {
    const stacked = (top, bottom) => {
      const spacing = (top.size + bottom.size) / 2;
      return Math.abs(top.x - bottom.x) <= spacing * .28 &&
        bottom.y - top.y >= spacing * .64 && bottom.y - top.y <= spacing * 1.10;
    };
    for (const head of balls) {
      const ready = balls.some(middle => middle.size > head.size && stacked(head, middle) &&
        balls.some(base => base.size > middle.size && stacked(middle, base)));
      head.element.classList.toggle("snowman-head", ready);
    }
  }

  function start(event, ball, growing) {
    const target = event.currentTarget;
    target.setPointerCapture(event.pointerId);
    held = { pointer: event.pointerId, ball, growing, lastX: event.clientX, distance: 0,
      offsetX: ball.x - event.clientX, offsetY: ball.y - event.clientY };
    ball.element.classList.add("snowball-held");
    event.preventDefault();
  }

  bankEl.addEventListener("pointerdown", event => {
    if (event.button !== 0 || held || balls.length >= 12) return;
    const element = document.createElement("div");
    element.className = "snowman-ball";
    const ball = { element, x: event.clientX, y: event.clientY, size: 15 };
    element.innerHTML = '<span class="snowman-face"></span><span class="snowman-nose"></span><span class="snowman-scarf"></span>';
    element.addEventListener("pointerdown", next => {
      if (next.button === 0 && !held) start(next, ball, false);
    });
    snowman.append(element);
    place(ball, ball.x, ball.y);
    start(event, ball, true);
  });

  window.addEventListener("pointermove", event => {
    if (held?.pointer !== event.pointerId) return;
    const { ball } = held;
    if (held.growing && event.clientY >= bankEl.getBoundingClientRect().top) {
      held.distance += Math.abs(event.clientX - held.lastX);
      ball.size = Math.min(108, 15 + held.distance * .33);
    }
    held.lastX = event.clientX;
    place(ball, event.clientX + held.offsetX, event.clientY + held.offsetY);
  });

  function release(event) {
    if (held?.pointer !== event.pointerId) return;
    const { ball, growing, distance } = held;
    held = null;
    ball.element.classList.remove("snowball-held");
    if (growing) {
      if (event.type === "pointerup" && distance >= 24) balls.push(ball);
      else ball.element.remove();
    }
    decorate();
  }

  window.addEventListener("pointerup", release);
  window.addEventListener("pointercancel", release);
  window.addEventListener("lostpointercapture", release);
  window.addEventListener("resize", () => {
    for (const ball of balls) place(ball, ball.x, ball.y);
    decorate();
  });

  /* ---------- HOUSE SHADOW ---------- */
  /* ---------- BUILD ---------- */
  function build(){
    const houseWrapper = el("#houseWrapper");
    CELLS.forEach(c => {
      const b = document.createElement("button");
      b.className = "win" + (done[c.d] ? " open done" : "");
      b.style.left = ((c.x - c.w/2) / 1672 * 100) + "%";
      b.style.top = ((c.y - c.h/2) / 941 * 100) + "%";
      b.style.width = (c.w / 1672 * 100) + "%";
      b.style.height = (c.h / 941 * 100) + "%";
      b.setAttribute("aria-label", "Day " + c.d);
      b.dataset.day = c.d;
      b.innerHTML = '<span class="flap"></span><span class="glow"></span>';
      b.addEventListener("click", () => {
        tear();
        b.classList.add("open");
        setTimeout(() => openTask(c.d), 280);
      });
      houseWrapper.appendChild(b);
    });
    updateCount();
  }

  function updateCount(){
    const n = Object.keys(done).filter(k => done[k]).length;
    el("#count").textContent = n + " / 31";
  }

  /* ---------- TASK PAGE ---------- */
  function openTask(day){
    const d = DOORS[day - 1];
    const name = NAMES[day] || "Window " + day;
    const items = d.items && d.items.a
      ? '<ul class="tp-list">' + d.items.a.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" : "";
    const shots = d.images && d.images.length
      ? '<div class="tp-shots">' + d.images.map(im => '<a href="' + esc(im.src) + '" target="_blank" rel="noopener"><img src="' + esc(im.src) + '" alt=""></a>').join("") + "</div>" : "";
    const media = (d.media && d.media.length) || (d.links && d.links.length)
      ? '<div class="tp-links">' +
        (d.media || []).map(m => '<a href="' + esc(m.url) + '" target="_blank" rel="noopener">' + esc(m.label) + "</a>").join("") +
        (d.links || []).map(l => '<a href="' + esc(l.href) + '" target="_blank" rel="noopener">' + esc(l.label) + "</a>").join("") +
        "</div>" : "";

    el("#tpInner").innerHTML =
      '<div class="tp-reading"><header class="tp-heading"><div class="tp-num">' + String(day).padStart(2, "0") + '</div>' +
      '<div class="tp-title-badge">' + esc(NAMES[day]) + '</div>' +
      '<h2 class="tp-title">' + esc(d.title) + '</h2></header>' +
      '<p class="tp-text">' + esc(d.task) + '</p>' +
      items + shots + media +
      '<p class="tp-level" id="tpLevel">' + esc(d.b1) + '</p></div>' +
      '<div class="tp-answer"><textarea id="tpAns" aria-label="Your answer" placeholder="' + esc(d.prompt || "Write your answer…") + '"></textarea>' +
      '<div class="tp-actions"><button class="tp-done' + (done[day] ? " on" : "") + '" id="tpDone" type="button">' +
      (done[day] ? "✓ done" : "mark as done") + '</button>' +
      '<span class="tp-hint" id="tpHint">saved</span></div></div>';

    const page = el("#taskPage");
    window.AdventTree?.frame(page, day);
    page.hidden = false;
    page.scrollTop = 0;
    el(".task-sheet").scrollTop = 0;
    document.body.style.overflow = "hidden";

    const ta = el("#tpAns");
    ta.value = ans[day] || "";
    ta.addEventListener("input", () => { ans[day] = ta.value; save(KA, ans); el("#tpHint").textContent = "saved"; });

    el("#tpDone").addEventListener("click", () => {
      done[day] = !done[day];
      save(KD, done); pop();
      const btn = el("#tpDone");
      btn.classList.toggle("on", !!done[day]);
      btn.textContent = done[day] ? "✓ done" : "mark as done";
      const w = document.querySelector('.win[data-day="' + day + '"]');
      if (w) w.classList.toggle("done", !!done[day]);
      updateCount();
      if (done[day]) window.AdventTree?.open(day, true);
    });
  }

  function closeTask(){
    el("#taskPage").hidden = true;
    document.body.style.overflow = "";
    current = null;
  }

  /* ---------- SNOW LOOP ---------- */
  const cv = el("#snow"), ctx = cv.getContext("2d");
  let flakes = [], SW = 0, SH = 0, dpr = Math.min(devicePixelRatio || 1, 2);

  function resizeSnow(){
    SW = innerWidth; SH = innerHeight;
    cv.width = SW * dpr; cv.height = SH * dpr;
    cv.style.width = SW + "px"; cv.style.height = SH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const N = Math.round(SW / 10);
    flakes = Array.from({length: N}, () => {
      const layer = Math.random() < .5 ? 0 : (Math.random() < .75 ? 1 : 2);
      return {
        layer,
        x: Math.random() * SW,
        y: Math.random() * SH,
        r: layer === 0 ? 1.4 + Math.random() * 1.6 : layer === 1 ? 2.8 + Math.random() * 2 : 4.8 + Math.random() * 3.5,
        vy: layer === 0 ? .2 + Math.random() * .25 : layer === 1 ? .5 + Math.random() * .45 : 1.0 + Math.random() * .8,
        vx: (Math.random() - .5) * (.14 + layer * .16),
        ph: Math.random() * Math.PI * 2
      };
    });
  }

  function drawFlake(f, t){
    if (f.layer === 2){
      ctx.strokeStyle = "rgba(255,255,255,.95)";
      ctx.lineWidth = 1.4;
      const a = t / 2200 + f.ph;
      ctx.beginPath();
      for (let i = 0; i < 3; i++){
        const a3 = a + i * Math.PI / 3;
        ctx.moveTo(f.x - Math.cos(a3) * f.r, f.y - Math.sin(a3) * f.r);
        ctx.lineTo(f.x + Math.cos(a3) * f.r, f.y + Math.sin(a3) * f.r);
      }
      ctx.stroke();
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * .18, 0, 7);
      ctx.fillStyle = "rgba(255,255,255,.95)"; ctx.fill();
    } else if (f.layer === 1){
      ctx.strokeStyle = "rgba(255,255,255,.8)";
      ctx.lineWidth = 1.1;
      const a = f.ph;
      ctx.beginPath();
      for (let i = 0; i < 3; i++){
        const a3 = a + i * Math.PI / 3;
        ctx.moveTo(f.x - Math.cos(a3) * f.r, f.y - Math.sin(a3) * f.r);
        ctx.lineTo(f.x + Math.cos(a3) * f.r, f.y + Math.sin(a3) * f.r);
      }
      ctx.stroke();
    } else {
      ctx.fillStyle = "rgba(255,255,255,.65)";
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
    }
  }

  function snowLoop(t){
    ctx.clearRect(0, 0, SW, SH);
    for (const f of flakes){
      f.y += f.vy;
      f.x += f.vx + Math.sin((t / 1900) + f.ph) * (.12 + f.layer * .16);
      if (f.y > SH - 12){ f.y = -10; f.x = Math.random() * SW; }
      if (f.x < -14) f.x = SW + 14;
      if (f.x > SW + 14) f.x = -14;
      drawFlake(f, t);
    }
    requestAnimationFrame(snowLoop);
  }

  /* ---------- INIT ---------- */
  document.addEventListener("DOMContentLoaded", () => {
    build(); drawLights(); resizeSnow(); updateCountdown();
    requestAnimationFrame(snowLoop);
    window.addEventListener("resize", resizeSnow);
    setInterval(updateCountdown, 30000);

    const treeHome = el("#treeHome");
    if (window.AdventTree) {
      treeHome.hidden = false;
      treeHome.addEventListener("click", () => {
        const days = Object.keys(done).filter(day => done[day]).map(Number);
        window.AdventTree.open(Math.max(0, ...days));
      });
    }
    el("#back").addEventListener("click", closeTask);
    document.addEventListener("keydown", e => { if (e.key === "Escape" && el("#treePage").hidden) closeTask(); });

    el("#reset").addEventListener("click", () => {
      done = {}; ans = {}; save(KD, done); save(KA, ans);
      document.querySelectorAll(".win").forEach(w => w.classList.remove("open", "done"));
      updateCount();
    });

    const q = new URLSearchParams(location.search).get("d");
    if (q && +q >= 1 && +q <= 31) setTimeout(() => openTask(+q), 300);
  });
})();
</script>
