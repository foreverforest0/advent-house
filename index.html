<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advent · the house</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}

:root{
  --paper:#FCE8C2;
  --paper-2:#F8DFB4;
  --red:#941704;
  --green:#053B2D;
  --gold:#C99A2E;
  --ink:#2A1A14;
  --ink-soft:rgba(42,26,20,.6);
  --mono:'Cutive Mono','Courier New',monospace;
  --serif:'Lora',Georgia,serif;
  --dot:rgba(148,23,4,.5);
}

html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--mono)}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
}

/* ---------- чип прогресса ---------- */
.chip{
  position:fixed;left:14px;bottom:14px;z-index:22;
  display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-soft);background:rgba(247,239,219,.86);
  border:1px dotted rgba(148,23,4,.35);border-radius:999px;padding:6px 12px;
  backdrop-filter:blur(3px);
}
.chip b{color:var(--red);font-weight:400}
.chip .dotsb{display:inline-flex;align-items:center;gap:5px;transition:transform .18s}
.chip .dotsb i{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(42,26,20,.3);display:inline-block}
.chip .dotsb.bump{transform:scale(1.2)}
.chip .rst{margin-left:2px;color:rgba(42,26,20,.4);cursor:pointer;border:0;background:none;font:inherit;letter-spacing:.14em}
.chip .rst:hover{color:var(--red)}

/* ---------- дом ---------- */
.stage{position:fixed;inset:0;z-index:1;overflow:hidden}
.house{position:absolute;top:54px;left:50%;width:1122px;height:1402px;transform-origin:top center}
.house img{
  display:block;width:100%;height:auto;border-radius:4px;
  
}
.houseshadow{position:absolute;left:0;right:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lights{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.win{
  position:absolute;padding:0;border:0;background:transparent;cursor:pointer;
  perspective:420px;perspective-origin:50% 0;-webkit-tap-highlight-color:transparent;
}
.win:focus-visible{outline:2px dotted var(--red);outline-offset:3px}

/* створка как страница книги — видна только перфорация */
.flap{
  position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
  background:transparent;
  box-shadow:none;
  display:flex;align-items:center;justify-content:center;
  transition:transform .62s cubic-bezier(.34,.9,.24,1), box-shadow .35s;
  backface-visibility:visible;
}
.flap::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  border:1.5px dotted rgba(148,23,4,.4);border-radius:1px;
  transition:opacity .18s, border-color .18s;
}
.win:hover .flap::after{border-color:rgba(148,23,4,.7);box-shadow:0 0 0 2px rgba(247,239,219,.6)}
.win.crack .flap{animation:crack .18s ease-out}
@keyframes crack{
  0%{transform:rotateY(0)}
  35%{transform:rotateY(-4deg)}
  70%{transform:rotateY(-1deg)}
  100%{transform:rotateY(0)}
}
.win.open .flap{
  transform:rotateY(-118deg);
  box-shadow:2px 1px 10px -4px rgba(42,26,20,.45), inset 0 0 0 1px rgba(255,255,255,.35);
}
.win.open .flap::after{opacity:.45;transform:rotateY(0deg)}
.win.done .flap::after{border-color:rgba(5,59,45,.45)}

.win .glow{
  position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:1px;
  background:radial-gradient(circle at 50% 58%, rgba(255,206,126,.42), rgba(255,206,126,0) 72%);
  transition:opacity .6s ease;
}
.win.open .glow{opacity:1}

.win .mark{
  position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;
  background:var(--green);opacity:0;transition:opacity .3s .2s;pointer-events:none;
  box-shadow:0 0 0 2px var(--paper);
}
.win.done .mark{opacity:1}

/* ---------- снег и сугроб ---------- */
#snow{position:fixed;inset:0;z-index:40;pointer-events:none}
.bank{position:fixed;left:0;right:0;bottom:0;height:46px;z-index:12;cursor:pointer;
      filter:drop-shadow(0 -4px 8px rgba(42,26,20,.07))}
.bank svg{width:100%;height:100%;display:block}
.puff{position:fixed;z-index:41;width:12px;height:12px;border-radius:50%;background:#fff;
  border:1px solid rgba(42,26,20,.18);pointer-events:none;animation:puff .5s ease-out forwards}
@keyframes puff{from{transform:translate(-50%,-50%) scale(.4);opacity:.95}to{transform:translate(-50%,-160%) scale(2);opacity:0}}

/* ---------- страница задания ---------- */
.task-page{
  position:fixed;inset:0;z-index:30;background:var(--paper);overflow-y:auto;
  animation:pageIn .32s cubic-bezier(.2,.7,.3,1);
}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.task-page .garland{position:absolute;left:0;right:0;top:0;height:46px;pointer-events:none;opacity:.95}
.tp-inner{position:relative;max-width:820px;margin:0 auto;padding:58px 24px 120px}
.back{
  position:fixed;left:16px;top:58px;z-index:32;font-family:var(--mono);font-size:9px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--red);
  background:rgba(247,239,219,.92);border:1px dotted rgba(148,23,4,.4);border-radius:999px;
  cursor:pointer;padding:7px 13px;
}
.back:hover{color:var(--red)}

.tp-num{font-family:var(--mono);font-size:clamp(56px,9vw,104px);line-height:.9;color:var(--red);letter-spacing:.02em}
.tp-title{font-family:var(--mono);font-size:clamp(15px,1.7vw,19px);letter-spacing:.18em;text-transform:uppercase;
  color:var(--green);margin:14px 0 26px}
.tp-text{font-family:var(--serif);font-size:clamp(20px,2.5vw,30px);line-height:1.55;margin:0 0 26px;max-width:760px}
.tp-text b{color:var(--red);font-weight:400}

.tp-list{margin:0 0 26px;padding:0;list-style:none;max-width:760px}
.tp-list li{font-family:var(--serif);font-size:clamp(16px,1.9vw,21px);line-height:1.7;color:var(--ink);
  padding-left:22px;position:relative}
.tp-list li::before{content:"—";position:absolute;left:0;color:var(--green)}

.tp-shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 24px;max-width:760px}
.tp-shots a{display:block;aspect-ratio:4/3;overflow:hidden;border:1px solid rgba(148,23,4,.3);border-radius:3px}
.tp-shots img{width:100%;height:100%;object-fit:cover;display:block}

.tp-links{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.tp-links a{font-size:9px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--green);
  border:1px solid rgba(5,59,45,.32);border-radius:999px;padding:6px 11px}
.tp-links a:hover{background:rgba(5,59,45,.06)}

.tp-levels{display:inline-flex;border:1px dotted rgba(148,23,4,.45);border-radius:999px;padding:3px;gap:2px;margin-bottom:12px}
.tp-levels button{font-family:var(--mono);font-size:10px;letter-spacing:.12em;padding:5px 13px;border-radius:999px;
  border:0;background:transparent;color:var(--ink-soft);cursor:pointer}
.tp-levels button.on{background:var(--red);color:var(--paper)}
.tp-level{font-family:var(--serif);font-size:clamp(16px,1.9vw,20px);line-height:1.6;color:var(--ink);
  border-left:2px solid var(--green);padding-left:16px;margin:0 0 34px;max-width:760px}

.tp-answer{max-width:760px}
.tp-answer textarea{
  width:100%;min-height:150px;resize:vertical;font-family:var(--serif);font-size:clamp(16px,1.9vw,19px);
  line-height:1.6;color:var(--ink);background:#FDFAF2;border:1.5px dotted rgba(148,23,4,.45);
  border-radius:4px;padding:16px 18px;outline:none;
}
.tp-answer textarea:focus{border-style:solid;border-color:var(--red)}
.tp-actions{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap}
.tp-done{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  padding:10px 20px;border-radius:999px;border:1px solid var(--red);background:var(--red);color:var(--paper);cursor:pointer}
.tp-done.on{background:var(--green);border-color:var(--green)}
.tp-hint{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}

/* ---------- лампочки ---------- */
.bulb{animation:blink 2.8s infinite}
.bulb:nth-child(2n){animation-delay:.7s}
.bulb:nth-child(3n){animation-delay:1.4s}
@keyframes blink{0%,70%,100%{opacity:1}78%,86%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.bulb{animation:none}}

@media(max-width:700px){
  .bar{height:46px;font-size:8.5px}
  .house{top:46px}
  .tp-inner{padding:52px 18px 110px}
  .tp-shots{grid-template-columns:1fr 1fr}
  .bank{height:34px}
}
</style>
</head>
<body>

<canvas id="snow"></canvas>

<div class="chip"><b id="count">0</b>/31<span class="dotsb"><i></i><b id="snowballs">0</b></span><button class="rst" id="reset" type="button">reset</button></div>

<div class="stage" id="stage">
  <div class="house" id="house">
    <img src="facade.jpg" alt="Hand-drawn advent house">
    <svg class="houseshadow" id="houseShadow" viewBox="0 0 1122 1402" aria-hidden="true"></svg>
    <svg class="lights" id="lights" viewBox="0 0 1122 1402" aria-hidden="true"></svg>
  </div>
</div>

<div class="bank" id="bank" title="Gather snow">
  <svg viewBox="0 0 1000 50" preserveAspectRatio="none">
    <path d="M0 50 L0 24 q36 -14 74 -4 q44 -16 90 -2 q44 -14 90 -2 q44 -13 90 -2 q44 -13 90 -2 q44 -13 90 -2 q44 -13 90 -2 q44 -13 90 -2 q44 -13 90 -2 q44 -13 90 -2 q44 -13 90 -1 q36 -9 74 3 L1000 50 Z"
          fill="#FDFBF6" stroke="#2A1A14" stroke-width="1.4" stroke-opacity=".28"/>
  </svg>
</div>

<section class="task-page" id="taskPage" hidden>
  <svg class="garland" id="garland" viewBox="0 0 1000 46" preserveAspectRatio="none" aria-hidden="true"></svg>
  <button class="back" id="back" type="button">← the house</button>
  <div class="tp-inner" id="tpInner"></div>
</section>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  const DATA = window.ADVENT, DOORS = DATA.doors;
  const WD = { "пн":"mon","вт":"tue","ср":"wed","чт":"thu","пт":"fri","сб":"sat","вс":"sun" };
  const el = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* координаты по красным номерам рисунка (1122 × 1402) */
  const W = 1122, H = 1402;
  const CELLS = [
    { d:28, x:275, y:294, w:58, h:62, arch:1 },
    { d:16, x:420, y:294, w:58, h:62, arch:1 },
    { d:29, x:572, y:292, w:58, h:62, arch:1 },
    { d:3, x:713, y:294, w:52, h:62, arch:1 },
    { d:15, x:855, y:296, w:58, h:62, arch:1 },
    { d:7, x:224, y:477, w:66, h:80, arch:1 },
    { d:20, x:400, y:477, w:66, h:80, arch:1 },
    { d:31, x:571, y:473, w:58, h:80, arch:1 },
    { d:4, x:734, y:478, w:60, h:80, arch:1 },
    { d:13, x:901, y:476, w:66, h:80, arch:1 },
    { d:23, x:230, y:678, w:66, h:80, arch:1 },
    { d:9, x:406, y:678, w:58, h:80, arch:1 },
    { d:6, x:567, y:680, w:58, h:80, arch:1 },
    { d:17, x:730, y:677, w:66, h:80, arch:1 },
    { d:26, x:897, y:680, w:66, h:80, arch:1 },
    { d:21, x:224, y:863, w:66, h:78, arch:1 },
    { d:2, x:397, y:864, w:56, h:78, arch:1 },
    { d:19, x:567, y:862, w:60, h:78, arch:1 },
    { d:30, x:730, y:862, w:66, h:78, arch:1 },
    { d:22, x:905, y:863, w:66, h:78, arch:1 },
    { d:18, x:220, y:1021, w:64, h:78, arch:1 },
    { d:12, x:396, y:1021, w:60, h:78, arch:1 },
    { d:5, x:568, y:1021, w:56, h:78, arch:1 },
    { d:27, x:731, y:1020, w:64, h:78, arch:1 },
    { d:10, x:903, y:1021, w:64, h:78, arch:1 },
    { d:8, x:212, y:1221, w:60, h:86 },
    { d:14, x:355, y:1221, w:60, h:86 },
    { d:25, x:511, y:1205, w:62, h:110 },
    { d:11, x:671, y:1221, w:60, h:86 },
    { d:24, x:810, y:1222, w:60, h:86 },
    { d:1, x:944, y:1222, w:56, h:86 }
  ];

  const KD = "adv26.house.done", KA = "adv26.house.ans", KB = "adv26.house.balls";
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e){ return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
  let done = load(KD, {}), ans = load(KA, {}), balls = load(KB, 0), current = null;

  /* ---------- звук ---------- */
  let ac = null, tearBuf = null;

  function loadTear(){
    fetch('tear.wav').then(async (r) => {
      const ab = await r.arrayBuffer();
      tearBuf = await audio().decodeAudioData(ab);
    }).catch(() => {});
  }

  function audio(){
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function noiseBuffer(a, dur){
    const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function tear(){
    const a = audio();
    if (tearBuf) {
      const s = a.createBufferSource();
      s.buffer = tearBuf;
      const g = a.createGain();
      g.gain.setValueAtTime(.22, a.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .34);
      s.connect(g).connect(a.destination);
      s.start();
    } else {
      noiseTear(a);
    }
  }

  function noiseTear(a){
    const dur = .34, n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(); src.buffer = b;
    const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(2600, a.currentTime);
    bp.frequency.exponentialRampToValueAtTime(600, a.currentTime + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.19, a.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
    src.connect(bp).connect(g).connect(a.destination); src.start();
  }

  function pop(){
    const a = audio(), o = a.createOscillator(), g = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(720, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(430, a.currentTime + .12);
    g.gain.setValueAtTime(.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.11, a.currentTime + .01);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .14);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .16);
  }

  /* ---------- гирлянда ---------- */
  function drawLights(){
    let out = "";
    const N = 16;
    for (let i = 0; i < N; i++){
      const x = 128 + i * (868 / (N - 1));
      const y = 560 + Math.sin(i / (N - 1) * Math.PI * 3) * 12;
      const col = i % 3 === 0 ? "#B3371B" : i % 3 === 1 ? "#C99A2E" : "#3F6B4A";
      out += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="9" fill="' + col + '" opacity=".10"/>';
      out += '<circle class="bulb" cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="4.6" fill="' + col + '"/>';
    }
    el("#lights").innerHTML = out;
    el("#houseShadow").innerHTML =
      '<defs><filter id="gs" x="-30%" y="-60%" width="160%" height="260%">' +
      '<feGaussianBlur stdDeviation="26"/></filter></defs>' +
      '<ellipse cx="561" cy="1332" rx="360" ry="26" fill="#2A1A14" opacity=".22" filter="url(#gs)"/>';

    let g = "";
    for (let i = 0; i < 22; i++){
      const x = 22 + i * 45.5;
      const y = 22 + Math.sin(i / 21 * Math.PI * 4) * 9;
      const col = i % 3 === 0 ? "#B3371B" : i % 3 === 1 ? "#C99A2E" : "#3F6B4A";
      g += '<circle cx="' + x + '" cy="' + y + '" r="7" fill="' + col + '" opacity=".10"/>';
      g += '<circle class="bulb" cx="' + x + '" cy="' + y + '" r="3.6" fill="' + col + '"/>';
    }
    el("#garland").innerHTML = '<path d="M0 18 Q250 34 500 18 T1000 18" fill="none" stroke="#2A1A14" stroke-opacity=".25" stroke-width="1.4"/>' + g;
  }

  /* ---------- окна ---------- */
  function build(){
    const house = el("#house");
    CELLS.forEach(c => {
      const b = document.createElement("button");
      b.className = "win" + (done[c.d] ? " open done" : "");
      b.style.left = ((c.x - c.w/2) / W * 100) + "%";
      b.style.top = ((c.y - c.h/2) / H * 100) + "%";
      b.style.width = (c.w / W * 100) + "%";
      b.style.height = (c.h / H * 100) + "%";
      b.dataset.day = c.d;
      b.setAttribute("aria-label", "Day " + c.d);
      b.innerHTML = '<span class="flap"></span><span class="glow"></span>';
      b.addEventListener("click", () => {
        audio(); tear();
        b.classList.add("open");
        setTimeout(() => openTask(c.d), 260);
      });
      house.appendChild(b);
    });
    updateCount();
  }

  function updateCount(){
    const n = Object.keys(done).filter(k => done[k]).length;
    el("#count").textContent = n;
  }

  /* ---------- страница задания ---------- */
  function openTask(day){
    const d = DOORS[day - 1];
    current = day;

    const items = d.items && d.items.a
      ? '<ul class="tp-list">' + d.items.a.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>" : "";
    const shots = d.images && d.images.length
      ? '<div class="tp-shots">' + d.images.map(im => '<a href="' + esc(im.src) + '" target="_blank" rel="noopener"><img src="' + esc(im.src) + '" alt=""></a>').join("") + "</div>" : "";
    const media = (d.media && d.media.length) || (d.links && d.links.length)
      ? '<div class="tp-links">' +
        (d.media || []).map(m => '<a href="' + esc(m.url) + '" target="_blank" rel="noopener">' + esc(m.label) + "</a>").join("") +
        (d.links || []).map(l => '<a href="' + esc(l.href) + '" target="_blank" rel="noopener">' + esc(l.label) + "</a>").join("") +
        "</div>" : "";

    el("#tpInner").innerHTML =
      '<div class="tp-num">' + String(day).padStart(2, "0") + '</div>' +
      '<div class="tp-title">' + esc(d.title) + '</div>' +
      '<p class="tp-text">' + esc(d.task) + '</p>' +
      items + shots + media +
      '<div class="tp-levels"><button type="button" data-lvl="b1" class="on">B1</button><button type="button" data-lvl="b2">B2</button></div>' +
      '<p class="tp-level" id="tpLevel">' + esc(d.b1) + '</p>' +
      '<div class="tp-answer"><textarea id="tpAns" placeholder="' + esc(d.prompt || "") + '"></textarea>' +
      '<div class="tp-actions"><button class="tp-done' + (done[day] ? " on" : "") + '" id="tpDone" type="button">' +
      (done[day] ? "✓ done" : "mark as done") + '</button>' +
      '<span class="tp-hint" id="tpHint">saved</span></div></div>';

    const page = el("#taskPage");
    page.hidden = false;
    page.scrollTop = 0;
    document.body.style.overflow = "hidden";

    const ta = el("#tpAns");
    ta.value = ans[day] || "";
    ta.addEventListener("input", () => { ans[day] = ta.value; save(KA, ans); el("#tpHint").textContent = "saved"; });

    document.querySelectorAll(".tp-levels button").forEach(b => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".tp-levels button").forEach(x => x.classList.toggle("on", x === b));
        el("#tpLevel").textContent = b.dataset.lvl === "b1" ? d.b1 : d.b2;
      });
    });

    el("#tpDone").addEventListener("click", () => {
      done[day] = !done[day];
      save(KD, done); pop();
      const btn = el("#tpDone");
      btn.classList.toggle("on", !!done[day]);
      btn.textContent = done[day] ? "✓ done" : "mark as done";
      updateCount();
      const w = document.querySelector('.win[data-day="' + day + '"]');
      if (w) w.classList.toggle("done", !!done[day]);
    });

    const w = document.querySelector('.win[data-day="' + day + '"]');
    if (w) w.classList.add("open");
  }

  function closeTask(){
    el("#taskPage").hidden = true;
    current = null;
  }

  /* ---------- снег ---------- */
  const cv = el("#snow"), ctx = cv.getContext("2d");
  let flakes = [], SW = 0, SH = 0, dpr = Math.min(devicePixelRatio || 1, 2);

  function resizeSnow(){
    SW = innerWidth; SH = innerHeight;
    cv.width = SW * dpr; cv.height = SH * dpr;
    cv.style.width = SW + "px"; cv.style.height = SH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const N = Math.round(SW / 16);
    flakes = Array.from({length: N}, () => {
      const layer = Math.random() < .55 ? 0 : (Math.random() < .7 ? 1 : 2);
      return {
        layer,
        x: Math.random() * SW,
        y: Math.random() * SH,
        r: layer === 0 ? .8 + Math.random() * .9 : layer === 1 ? 1.8 + Math.random() * 1.4 : 3.4 + Math.random() * 2.4,
        vy: layer === 0 ? .18 + Math.random() * .25 : layer === 1 ? .45 + Math.random() * .4 : .85 + Math.random() * .7,
        vx: (Math.random() - .5) * (.1 + layer * .12),
        ph: Math.random() * Math.PI * 2,
        sp: 12 + Math.random() * 20
      };
    });
  }

  function flakeArm(x, y, r, rot){
    ctx.beginPath();
    for (let i = 0; i < 3; i++){
      const a = rot + i * Math.PI / 3;
      ctx.moveTo(x - Math.cos(a) * r, y - Math.sin(a) * r);
      ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    }
    ctx.stroke();
  }

  function snowLoop(t){
    ctx.clearRect(0, 0, SW, SH);
    for (const f of flakes){
      f.y += f.vy;
      f.x += f.vx + Math.sin((t / 2200) + f.ph) * (.08 + f.layer * .12);
      if (f.y > SH - 16){ f.y = -10; f.x = Math.random() * SW; }
      if (f.x < -12) f.x = SW + 12;
      if (f.x > SW + 12) f.x = -12;

      if (f.layer === 2){
        ctx.strokeStyle = "rgba(255,255,255,.92)";
        ctx.lineWidth = 1.1;
        flakeArm(f.x, f.y, f.r, t / 2600 + f.ph);
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r * .18, 0, 7);
        ctx.fillStyle = "rgba(255,255,255,.95)";
        ctx.fill();
      } else if (f.layer === 1){
        ctx.strokeStyle = "rgba(255,255,255,.75)";
        ctx.lineWidth = .9;
        flakeArm(f.x, f.y, f.r, f.ph);
      } else {
        ctx.fillStyle = "rgba(255,255,255,.55)";
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, 7);
        ctx.fill();
      }
    }
    requestAnimationFrame(snowLoop);
  }

  el("#bank").addEventListener("click", (e) => {
    audio(); pop();
    balls++; save(KB, balls);
    el("#snowballs").textContent = balls;
    el("#snowballs").parentElement.classList.add("bump");
    setTimeout(() => el("#snowballs").parentElement.classList.remove("bump"), 300);
    const p = document.createElement("div");
    p.className = "puff";
    p.style.left = e.clientX + "px";
    p.style.top = e.clientY + "px";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 520);
  });

  /* ---------- вписать в экран ---------- */
  function fit(){
    const vh = innerHeight, vw = innerWidth;
    const top = vw <= 700 ? 46 : 54;
    const k = Math.min((vw - 16) / W, (vh - top - 10) / H);
    const house = el("#house");
    house.style.top = top + "px";
    house.style.transform = "translateX(-50%) scale(" + k + ")";
  }

  document.addEventListener("DOMContentLoaded", () => {
    build(); drawLights(); fit(); resizeSnow(); loadTear();
    el("#snowballs").textContent = balls;
    requestAnimationFrame(snowLoop);
    window.addEventListener("resize", fit);

    el("#back").addEventListener("click", closeTask);
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeTask(); });

    el("#reset").addEventListener("click", () => {
      done = {}; ans = {}; save(KD, done); save(KA, ans);
      document.querySelectorAll(".win").forEach(w => w.classList.remove("open", "done"));
      updateCount();
    });

    const peek = new URLSearchParams(location.search).get("peek");
    if (peek){
      const w = document.querySelectorAll(".win")[+peek];
      if (w){ w.classList.add("open"); const f = w.querySelector(".flap"); f.style.transition = "none"; f.style.transform = "rotateY(-118deg)"; }
    }

    const q = new URLSearchParams(location.search).get("d");
    if (q && +q >= 1 && +q <= 31) setTimeout(() => openTask(+q), 300);
  });
})();
</script>
</body>
</html>
