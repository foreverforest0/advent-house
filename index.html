<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advent · the house</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}

:root{
  --cream:#F7EFDB;
  --paper:#FBF7F0;
  --red:#941704;
  --green:#053B2D;
  --gold:#C99A2E;
  --ink:#2A1A14;
  --ink-soft:rgba(42,26,20,.62);
  --mono:'Cutive Mono','Courier New',monospace;
  --serif:'Lora',Georgia,serif;
}

html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:var(--mono)}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
}

/* ---------- header ---------- */
.head{position:relative;z-index:2;text-align:center;padding:30px 20px 2px}
.kicker{font-size:9.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
h1{font-family:var(--serif);font-weight:400;font-style:italic;font-size:clamp(26px,3.4vw,42px);
   letter-spacing:.01em;margin:0;color:var(--ink)}
h1 b{font-family:var(--mono);font-style:normal;font-weight:400;text-transform:uppercase;
     letter-spacing:.14em;font-size:.78em;color:var(--red)}
.sub{margin:8px 0 0;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}

/* ---------- house ---------- */
.stage{position:relative;z-index:1;display:flex;justify-content:center;padding:6px 10px 30px}
.house{position:relative;width:1122px;transform-origin:top center;
       filter:drop-shadow(0 18px 30px rgba(42,26,20,.10))}
.house img{display:block;width:100%;height:auto;border-radius:3px}
.house .lights{position:absolute;inset:0;pointer-events:none}

.win{position:absolute;padding:0;border:0;background:transparent;cursor:pointer;
     perspective:340px;perspective-origin:50% 0%;-webkit-tap-highlight-color:transparent}
.win:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.flap{
  position:absolute;inset:0;transform-origin:50% 0;transform-style:preserve-3d;
  background:linear-gradient(160deg, #FDF8EC, #F8F1DF 70%);
  border:1px solid rgba(148,23,4,.55);
  border-radius:2px;
  box-shadow:0 1px 3px rgba(42,26,20,.18), inset 0 0 0 1px rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;
  transition:transform .5s cubic-bezier(.42,.08,.2,1), opacity .5s .2s;
}
.flap::after{
  content:"";position:absolute;inset:3px;border:1px dashed rgba(148,23,4,.55);border-radius:1px;pointer-events:none;
}
.num{font-family:var(--mono);font-size:19px;line-height:1;color:var(--red);letter-spacing:.02em}
.win:hover .flap{transform:rotateX(-6deg);box-shadow:0 5px 9px rgba(42,26,20,.2), inset 0 0 0 1px rgba(255,255,255,.5)}
.win.open .flap{transform:rotateX(-112deg);opacity:.85}
.win.open .num{opacity:0}
.win.done .flap{border-color:var(--green);background:rgba(5,59,45,.06)}
.win .mark{position:absolute;inset:0;display:grid;place-items:center;opacity:0;color:var(--green);
           font-family:var(--mono);font-size:13px;transition:opacity .3s .2s;pointer-events:none}
.win.open .mark{opacity:1}

/* ---------- footer ---------- */
.foot{position:relative;z-index:2;text-align:center;padding:0 20px 24px;
      font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.foot b{color:var(--red);font-weight:400}
.foot .sep{opacity:.4;margin:0 8px}
.reset{margin-left:10px;font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
       background:none;border:1px solid rgba(148,23,4,.3);border-radius:999px;padding:5px 11px;color:var(--ink-soft);cursor:pointer}

/* ---------- snow ---------- */
#snow{position:fixed;inset:0;z-index:3;pointer-events:none}
.bank{position:fixed;left:0;right:0;bottom:0;height:64px;z-index:4;cursor:pointer;
      filter:drop-shadow(0 -5px 9px rgba(42,26,20,.07))}
.bank svg{width:100%;height:100%;display:block}
.bank .hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(42,26,20,.42);pointer-events:none;white-space:nowrap}
.puff{position:fixed;z-index:6;width:13px;height:13px;border-radius:50%;background:#fff;
  border:1px solid rgba(42,26,20,.18);pointer-events:none;animation:puff .55s ease-out forwards}
@keyframes puff{from{transform:translate(-50%,-50%) scale(.4);opacity:.95}to{transform:translate(-50%,-160%) scale(2.1);opacity:0}}

/* ---------- card ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(42,26,20,.42);backdrop-filter:blur(2px)}
.overlay.on{display:flex}
.sheet{position:relative;width:min(640px,100%);max-height:86vh;overflow-y:auto;
  background:var(--paper);padding:32px 34px 22px;border-radius:6px;
  box-shadow:0 40px 80px -40px rgba(42,26,20,.55)}
.sheet .frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sheet .frame path{fill:none;stroke:var(--red);stroke-width:1.8;vector-effect:non-scaling-stroke}
.close{position:absolute;top:10px;right:10px;z-index:3;width:28px;height:28px;border-radius:50%;
  border:1px solid rgba(148,23,4,.35);background:var(--paper);color:var(--red);font-size:13px;cursor:pointer}
.meta{display:flex;gap:12px;flex-wrap:wrap;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--green);margin-bottom:10px}
h2{font-family:var(--mono);font-weight:400;font-size:20px;letter-spacing:.04em;line-height:1.35;margin:0 0 12px;
   color:var(--red);text-transform:uppercase}
.task{font-family:var(--serif);font-size:17.5px;line-height:1.6;margin:0 0 14px}
.list{margin:0 0 14px;padding:11px 14px;border:1px dashed rgba(5,59,45,.35);border-radius:6px;
  background:rgba(5,59,45,.035);font-size:11px;line-height:1.85}
.list div{display:flex;gap:8px}
.list div::before{content:"—";color:var(--green)}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.shots a{aspect-ratio:4/3;display:block;overflow:hidden;border:1px solid rgba(148,23,4,.35);border-radius:3px}
.shots img{width:100%;height:100%;object-fit:cover;display:block}
.mat{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.mat a{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--green);
  border:1px solid rgba(5,59,45,.3);border-radius:999px;padding:5px 9px}
.levels{display:inline-flex;border:1px solid rgba(148,23,4,.3);border-radius:999px;padding:2px;gap:2px;margin-bottom:8px}
.levels button{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:4px 11px;border-radius:999px;
  border:0;background:transparent;color:var(--ink-soft);cursor:pointer}
.levels button.on{background:var(--red);color:var(--cream)}
.level-body{font-family:var(--serif);font-size:15px;line-height:1.6;border-left:2px solid var(--green);
  padding-left:11px;margin:0 0 16px}
.answer label{display:block;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--green);margin-bottom:5px}
.answer textarea{width:100%;min-height:90px;resize:vertical;font-family:var(--serif);font-size:15px;line-height:1.55;
  color:var(--ink);background:#fff;border:1.5px dashed rgba(148,23,4,.42);border-radius:4px;padding:10px 11px;outline:none}
.answer textarea:focus{border-style:solid;border-color:var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;
  padding-top:11px;border-top:1px dashed rgba(148,23,4,.28)}
.state{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.btn{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:7px 14px;border-radius:999px;border:1px solid var(--red);background:transparent;color:var(--red);cursor:pointer}
.btn.primary{background:var(--red);color:var(--cream)}
.btn.done{background:var(--green);border-color:var(--green);color:var(--cream)}

.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  background:var(--green);color:var(--cream);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:9px 15px;border-radius:999px;transition:.25s;z-index:70}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- bulbs ---------- */
.bulb{animation:blink 2.8s infinite}
.bulb:nth-child(2n){animation-delay:.7s}
.bulb:nth-child(3n){animation-delay:1.4s}
@keyframes blink{0%,70%,100%{opacity:1}78%,86%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.bulb{animation:none}}

@media(max-width:700px){
  .head{padding-top:20px}
  .num{font-size:15px}
  .sheet{padding:22px 16px 14px}
  .task{font-size:15.5px}
  .shots{grid-template-columns:1fr 1fr}
  .bank{height:50px}
}
</style>
</head>
<body>

<canvas id="snow"></canvas>

<header class="head">
  <div class="kicker">Advent Calendar · 2026</div>
  <h1>the house <b>of 31 windows</b></h1>
  <p class="sub">7–10 min a day · B1 / B2</p>
</header>

<div class="stage">
  <div class="house" id="house">
    <img src="facade.jpg" alt="Hand-drawn advent house">
    <svg class="lights" id="lights" viewBox="0 0 1122 1402" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
  </div>
</div>

<div class="foot">
  opened <b id="count">0 / 31</b><span class="sep">·</span>snowballs <b id="balls">0</b>
  <button class="reset" id="reset" type="button">Reset</button>
</div>

<div class="bank" id="bank" title="Gather snow">
  <svg viewBox="0 0 1000 70" preserveAspectRatio="none">
    <path d="M0 70 L0 34 q36 -18 74 -5 q44 -22 90 -3 q44 -20 90 -3 q44 -18 90 -3 q44 -18 90 -3 q44 -18 90 -3 q44 -18 90 -3 q44 -18 90 -3 q44 -18 90 -3 q44 -18 90 -3 q44 -18 90 -2 q36 -13 74 3 L1000 70 Z"
          fill="#FDFBF6" stroke="#2A1A14" stroke-width="1.6" stroke-opacity=".3"/>
  </svg>
  <span class="hint">click the snow to make a snowball</span>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" aria-live="polite"></div>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  const DATA = window.ADVENT, DOORS = DATA.doors;
  const WD = { "пн":"mon","вт":"tue","ср":"wed","чт":"thu","пт":"fri","сб":"sat","вс":"sun" };
  const el = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* координаты найдены по красным номерам на рисунке (1122 × 1402) */
  const W = 1122, H = 1402;
  const CELLS = [
    { d:28, x:275, y:294, w:58, h:62 }, { d:16, x:420, y:294, w:58, h:62 },
    { d:29, x:572, y:292, w:58, h:62 }, { d:3,  x:713, y:294, w:52, h:62 },
    { d:15, x:855, y:296, w:58, h:62 },

    { d:7,  x:224, y:477, w:66, h:80 }, { d:20, x:400, y:477, w:66, h:80 },
    { d:31, x:571, y:473, w:58, h:80 }, { d:4,  x:734, y:478, w:60, h:80 },
    { d:13, x:901, y:476, w:66, h:80 },

    { d:23, x:230, y:678, w:66, h:80 }, { d:9,  x:406, y:678, w:58, h:80 },
    { d:6,  x:567, y:680, w:58, h:80 }, { d:17, x:730, y:677, w:66, h:80 },
    { d:26, x:897, y:680, w:66, h:80 },

    { d:21, x:224, y:863, w:66, h:78 }, { d:2,  x:397, y:864, w:56, h:78 },
    { d:19, x:567, y:862, w:60, h:78 }, { d:30, x:730, y:862, w:66, h:78 },
    { d:22, x:905, y:863, w:66, h:78 },

    { d:18, x:220, y:1021, w:64, h:78 }, { d:12, x:396, y:1021, w:60, h:78 },
    { d:5,  x:568, y:1021, w:56, h:78 }, { d:27, x:731, y:1020, w:64, h:78 },
    { d:10, x:903, y:1021, w:64, h:78 },

    { d:8,  x:212, y:1221, w:60, h:86 }, { d:14, x:355, y:1221, w:60, h:86 },
    { d:25, x:511, y:1205, w:62, h:110 }, { d:11, x:671, y:1221, w:60, h:86 },
    { d:24, x:810, y:1222, w:60, h:86 }, { d:1,  x:944, y:1222, w:56, h:86 }
  ];

  const KD = "adv26.house.done", KA = "adv26.house.ans", KB = "adv26.house.balls";
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch(e){ return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
  let done = load(KD, {}), ans = load(KA, {}), balls = load(KB, 0), current = null;

  /* ---------- звук ---------- */
  let ac = null;
  function audio(){
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function noiseBuffer(a, dur){
    const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  function tear(){
    const a = audio(), dur = .3;
    const src = a.createBufferSource(); src.buffer = noiseBuffer(a, dur);
    const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(2400, a.currentTime);
    bp.frequency.exponentialRampToValueAtTime(650, a.currentTime + dur);
    const g = a.createGain();
    g.gain.setValueAtTime(.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.2, a.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
    src.connect(bp).connect(g).connect(a.destination); src.start();
  }
  function squish(){
    const a = audio(), dur = .13;
    const src = a.createBufferSource(); src.buffer = noiseBuffer(a, dur);
    const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 850;
    const g = a.createGain();
    g.gain.setValueAtTime(.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.14, a.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
    src.connect(lp).connect(g).connect(a.destination); src.start();
  }
  function pop(){
    const a = audio(), o = a.createOscillator(), g = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(720, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(430, a.currentTime + .12);
    g.gain.setValueAtTime(.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.11, a.currentTime + .01);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + .14);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .16);
  }

  /* ---------- гирлянда ---------- */
  function drawLights(){
    let out = "";
    const N = 16;
    for (let i = 0; i < N; i++){
      const x = 128 + i * (868 / (N - 1));
      const y = 560 + Math.sin(i / (N - 1) * Math.PI * 3) * 12;
      const col = i % 3 === 0 ? "#B3371B" : i % 3 === 1 ? "#C99A2E" : "#3F6B4A";
      out += '<circle class="bulb" cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="4.6" fill="' + col + '" opacity=".9"/>';
      out += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="9" fill="' + col + '" opacity=".10"/>';
    }
    el("#lights").innerHTML = out;
  }

  /* ---------- окна ---------- */
  function build(){
    const house = el("#house");
    CELLS.forEach(c => {
      const b = document.createElement("button");
      b.className = "win" + (done[c.d] ? " open done" : "");
      b.style.left = ((c.x - c.w/2) / W * 100) + "%";
      b.style.top = ((c.y - c.h/2) / H * 100) + "%";
      b.style.width = (c.w / W * 100) + "%";
      b.style.height = (c.h / H * 100) + "%";
      b.setAttribute("aria-label", "Day " + c.d);
      b.innerHTML = '<span class="flap"><span class="num">' + String(c.d).padStart(2, "0") + '</span></span><span class="mark">✓</span>';
      b.addEventListener("click", () => {
        audio(); tear();
        b.classList.add("open");
        setTimeout(() => openDoor(c.d), 230);
      });
      house.appendChild(b);
    });
    updateCount();
  }

  function updateCount(){
    const n = Object.keys(done).filter(k => done[k]).length;
    el("#count").textContent = n + " / 31";
    el("#balls").textContent = balls;
  }

  /* ---------- карточка ---------- */
  function wobbleRect(amp, seed){
    let s = seed || 1;
    const rr = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const pts = [], N = 46, pad = 3;
    for (let i = 0; i < N; i++){
      const t = i / N * 4;
      let x, y;
      if (t < 1){ x = pad + (100 - 2*pad) * t; y = pad; }
      else if (t < 2){ x = 100 - pad; y = pad + (100 - 2*pad) * (t - 1); }
      else if (t < 3){ x = 100 - pad - (100 - 2*pad) * (t - 2); y = 100 - pad; }
      else { x = pad; y = 100 - pad - (100 - 2*pad) * (t - 3); }
      pts.push([x + (rr() - .5) * amp, y + (rr() - .5) * amp]);
    }
    let d = "M" + pts[0][0].toFixed(2) + " " + pts[0][1].toFixed(2);
    for (let i = 1; i <= pts.length; i++){
      const p = pts[i % pts.length], q = pts[(i - 1) % pts.length];
      d += " Q" + q[0].toFixed(2) + " " + q[1].toFixed(2) + " " + ((p[0]+q[0])/2).toFixed(2) + " " + ((p[1]+q[1])/2).toFixed(2);
    }
    return d + " Z";
  }

  function openDoor(day){
    const d = DOORS[day - 1];
    current = day;
    const items = d.items && d.items.a
      ? '<div class="list">' + d.items.a.map(x => "<div>" + esc(x) + "</div>").join("") + "</div>" : "";
    const shots = d.images && d.images.length
      ? '<div class="shots">' + d.images.map(im => '<a href="' + esc(im.src) + '" target="_blank" rel="noopener"><img src="' + esc(im.src) + '" alt=""></a>').join("") + "</div>" : "";
    const media = d.media && d.media.length
      ? '<div class="mat">' + d.media.map(m => '<a href="' + esc(m.url) + '" target="_blank" rel="noopener">' + esc(m.label) + "</a>").join("") + "</div>" : "";
    const links = d.links && d.links.length
      ? '<div class="mat">' + d.links.map(l => '<a href="' + esc(l.href) + '" target="_blank" rel="noopener">' + esc(l.label) + "</a>").join("") + "</div>" : "";

    el("#sheet").innerHTML =
      '<svg class="frame" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="' + wobbleRect(1.6, day * 37 + 5) + '"/></svg>' +
      '<button class="close" id="close" aria-label="Close">✕</button>' +
      '<div class="meta"><span>day ' + day + '</span><span>' + (WD[d.wd] || d.wd) + '</span><span>' + d.min + "–" + (d.min + 2) + ' min</span></div>' +
      '<h2>' + esc(d.title) + '</h2>' +
      '<p class="task">' + esc(d.task) + '</p>' +
      items + shots + media + links +
      '<div class="levels"><button type="button" data-lvl="b1" class="on">B1</button><button type="button" data-lvl="b2">B2</button></div>' +
      '<div class="level-body" id="lvlBody">' + esc(d.b1) + '</div>' +
      '<div class="answer"><label for="ans">My answer</label>' +
      '<textarea id="ans" placeholder="' + esc(d.prompt || "Write your answer…") + '">' + esc(ans[day] || "") + "</textarea></div>" +
      '<div class="row"><span class="state" id="state">' + (ans[day] ? "saved" : "draft saves itself") + "</span>" +
      '<button class="btn ' + (done[day] ? "done" : "primary") + '" id="doneBtn" type="button">' + (done[day] ? "✓ done" : "done") + "</button></div>";

    el("#overlay").classList.add("on");
    document.body.style.overflow = "hidden";
    bind(day, d);
  }

  function bind(day, d){
    el("#close").addEventListener("click", close);
    const ta = el("#ans");
    ta.addEventListener("input", () => { ans[day] = ta.value; save(KA, ans); el("#state").textContent = "saved"; });
    document.querySelectorAll(".levels button").forEach(b => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".levels button").forEach(x => x.classList.toggle("on", x === b));
        el("#lvlBody").textContent = b.dataset.lvl === "b1" ? d.b1 : d.b2;
      });
    });
    el("#doneBtn").addEventListener("click", () => {
      done[day] = !done[day];
      save(KD, done); pop();
      el("#doneBtn").className = "btn " + (done[day] ? "done" : "primary");
      el("#doneBtn").textContent = done[day] ? "✓ done" : "done";
      updateCount();
      toast(done[day] ? "window opened" : "mark removed");
    });
  }

  function close(){
    el("#overlay").classList.remove("on");
    document.body.style.overflow = "";
    current = null;
  }

  let tt;
  function toast(m){
    const t = el("#toast");
    t.textContent = m; t.classList.add("on");
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 1700);
  }

  /* ---------- снег ---------- */
  const cv = el("#snow"), ctx = cv.getContext("2d");
  let flakes = [], SW = 0, SH = 0, dpr = Math.min(devicePixelRatio || 1, 2);

  function resizeSnow(){
    SW = innerWidth; SH = innerHeight;
    cv.width = SW * dpr; cv.height = SH * dpr;
    cv.style.width = SW + "px"; cv.style.height = SH + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    flakes = Array.from({length: Math.round(SW / 20)}, () => ({
      x: Math.random() * SW, y: Math.random() * SH,
      r: 1 + Math.random() * 2,
      vy: .3 + Math.random() * .85,
      vx: (Math.random() - .5) * .3,
      ph: Math.random() * Math.PI * 2
    }));
  }

  function snowLoop(t){
    ctx.clearRect(0, 0, SW, SH);
    ctx.fillStyle = "rgba(255,255,255,.92)";
    for (const f of flakes){
      f.y += f.vy;
      f.x += f.vx + Math.sin((t / 1600) + f.ph) * .32;
      if (f.y > SH - 30){ f.y = -8; f.x = Math.random() * SW; }
      if (f.x < -10) f.x = SW + 10;
      if (f.x > SW + 10) f.x = -10;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
    }
    requestAnimationFrame(snowLoop);
  }

  el("#bank").addEventListener("click", (e) => {
    audio(); squish();
    balls++; save(KB, balls);
    el("#balls").textContent = balls;
    const p = document.createElement("div");
    p.className = "puff";
    p.style.left = e.clientX + "px";
    p.style.top = e.clientY + "px";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 600);
    if (balls === 1) toast("snowball in your pocket");
  });

  function fit(){
    const house = el("#house");
    const k = Math.min(1, (innerWidth - 36) / 1122);
    house.style.transform = "scale(" + k + ")";
    house.style.marginBottom = (-((1 - k) * house.offsetHeight)) + "px";
  }

  document.addEventListener("DOMContentLoaded", () => {
    build(); drawLights(); fit(); resizeSnow();
    requestAnimationFrame(snowLoop);
    window.addEventListener("resize", fit);
    el("#reset").addEventListener("click", () => {
      done = {}; ans = {}; balls = 0;
      save(KD, done); save(KA, ans); save(KB, 0);
      document.querySelectorAll(".win").forEach(w => w.classList.remove("open", "done"));
      updateCount(); toast("reset");
    });
    el("#overlay").addEventListener("click", e => { if (e.target === el("#overlay")) close(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });
  });
})();
</script>
</body>
</html>
